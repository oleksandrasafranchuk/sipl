[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "sipl-toolkit"
version = "1.0.0"
description = "SIPL toolkit: parser, parse trees, semantic terms, evaluation and correctness checking"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Oleksandra Safranchuk" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
sipl = "sipl.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
